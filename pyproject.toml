[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd"
version = "0.1.0"
description = "从零实现的自动求导引擎 + 神经网络，纯 Python，仅依赖 math 库"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/cloud111630/easy-micrograd-imitate-pytorch-"

[tool.setuptools.packages.find]
include = ["micrograd*"]
